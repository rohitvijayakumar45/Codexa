[project]
name = "codexa-os"
version = "0.1.0"
description = "Engineering intelligence platform centered on the Codexa knowledge graph."
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.116,<1.0",
    "pydantic>=2.11,<3.0",
    "psycopg[binary]>=3.3,<4.0",
    "uvicorn[standard]>=0.35,<1.0",
    "openai>=1.0",
]

[project.optional-dependencies]
dev = [
    "httpx>=0.28,<1.0",
    "pytest>=8.4,<9.0",
]

[tool.setuptools.packages.find]
include = ["backend*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
